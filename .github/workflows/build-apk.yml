name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master", "v6.0" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master", "v6.0" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Pruebas y Compilación APK v6.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Environment Files & Keystore
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK
        id: package_apk
        run: |
          APP_VERSION="$(awk -F '"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)"
          if [ -z "$APP_VERSION" ]; then
            echo "No se pudo leer versionName desde app/build.gradle.kts" >&2
            exit 1
          fi
          APK_NAME="CarAudio-DSP-Pro-v${APP_VERSION}.apk"
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/${APK_NAME}"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAudio-DSP-Pro-v${{ steps.package_apk.outputs.version }}-APK
          path: release-output/${{ steps.package_apk.outputs.apk_name }}
          if-no-files-found: error

      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/${{ steps.package_apk.outputs.apk_name }}
          body_path: RELEASE_NOTES.md
          name: "Car Audio DSP Pro ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish current APK for the app catalog
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: App
          name: "Car Audio DSP Pro"
          body: "APK más reciente compilado y probado desde la rama main."
          files: release-output/${{ steps.package_apk.outputs.apk_name }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
