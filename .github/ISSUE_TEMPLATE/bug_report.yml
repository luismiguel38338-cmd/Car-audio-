name: Reporte de Error / Bug
description: Reporta un fallo técnico en Car Audio DSP Pro
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica qué ocurrió y en qué pantalla estabas (Reproductor, EQ, Bass Boost, Online, Descargas, Ajustes).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Modelo de teléfono y versión de Android
      placeholder: "Ej: TECNO BG6 • Android 14"
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Salida de audio utilizada
      placeholder: "Ej: Bluetooth Car Audio / Altavoz / Auriculares USB-C"
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir...
        2. Activar...
        3. Observar...
